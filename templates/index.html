<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACEest Fitness & Gym</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; margin: 0; }
    header { background: #d4af37; color: #111; padding: 1.2rem; text-align: center; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1rem;
           grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    section { background: #262626; border-radius: 8px; padding: 1rem; }
    h2 { color: #d4af37; margin-top: 0; }
    ul { padding-left: 1.1rem; }
  </style>
</head>
<body>
  <header><h1>ACEest Fitness & Gym</h1></header>
  <main>
    {% for code, p in programs.items() %}
    <section>
      <h2>{{ p.name }} ({{ code }})</h2>
      <h3>Workout</h3>
      <ul>{% for w in p.workout %}<li>{{ w }}</li>{% endfor %}</ul>
      <h3>Diet</h3>
      <ul>{% for d in p.diet %}<li>{{ d }}</li>{% endfor %}</ul>
      <p>Calories: body weight &times; {{ p.calorie_factor }} kcal</p>
    </section>
    {% endfor %}
  </main>
</body>
</html>
