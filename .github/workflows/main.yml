name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (syntax errors)
        run: python -m compileall -q app.py fitness tests

      - name: Lint with flake8
        run: flake8 .

  docker-build-and-test:
    name: Docker Image Assembly & Automated Testing
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: docker build --target runtime -t aceest-fitness:${{ github.sha }} .

      - name: Smoke test the runtime container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then echo; echo "Container is healthy"; exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs aceest; exit 1

      - name: Show image size
        if: always()
        run: docker images aceest-fitness
